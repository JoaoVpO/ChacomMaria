<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagamento — Chá com Maria</title>
<link rel="icon" type="image/png" href="images/igreja.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400;1,500&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" />
<link rel="stylesheet" href="style.css?v=33" />
<style>
  .leaves-bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .leaf-7  { left: 14%; width: 15px; height: 15px; animation-duration: 10.5s; animation-delay: 1.5s; }
  .leaf-8  { left: 33%; width: 17px; height: 17px; animation-duration: 8.5s;  animation-delay: 3.5s; }
  .leaf-9  { left: 55%; width: 14px; height: 14px; animation-duration: 11.5s; animation-delay: 0.5s; }
  .leaf-10 { left: 72%; width: 16px; height: 16px; animation-duration: 9s;    animation-delay: 4.5s; }
  .pay-wrapper {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 20px auto;
    padding: 0 16px;
  }
  .pay-card {
    background: #fffefc;
    border-radius: 16px;
    padding: 24px 18px;
    box-shadow: 0 12px 32px rgba(74, 31, 43, 0.12);
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .pay-card h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 28px;
    color: #4a1f2b;
    margin-bottom: 8px;
  }
  .pay-value {
    font-size: 22px;
    font-weight: bold;
    color: #4a1f2b;
    margin-bottom: 18px;
  }
  .pay-qrcode {
    width: 100%;
    max-width: 220px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 18px;
    background: #fffefc;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #a17e5c;
    font-size: 0.8rem;
    text-align: center;
    padding: 12px;
  }

  .pay-qrcode img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .pay-key-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a17e5c;
    margin-bottom: 6px;
  }
  .pay-key {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  .pay-key input {
    width: 100%;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 12px;
    border: 1px solid #e3d3c7;
    border-radius: 8px;
    background: #fdf8f5;
    color: #3a2e2c;
  }
  .pay-key button {
    width: 100%;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #4a1f2b;
    color: #f5e9dc;
    cursor: pointer;
  }
  .pay-key button:hover {
    background: #7a3b4a;
  }
  .pay-hint {
    font-size: 0.82rem;
    color: #6b5854;
    margin-bottom: 18px;
  }
  .pay-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.9rem;
    font-weight: bold;
    padding: 12px 16px;
    border-radius: 8px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
  }
  .pay-whatsapp:hover {
    background: #1ebe5a;
  }
  .pay-whatsapp svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  @media (min-width: 640px) {
    .pay-wrapper {
      margin: 40px auto;
    }
    .pay-card {
      padding: 28px 20px;
    }
    .pay-value {
      margin-bottom: 20px;
    }
    .pay-qrcode {
      margin-bottom: 20px;
    }
    .pay-key {
      flex-direction: row;
      margin-bottom: 20px;
    }
    .pay-key input {
      flex: 1;
    }
    .pay-key button {
      width: auto;
    }
  }
</style>
</head>
<body>

  <div class="leaves-bg" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
    <span class="leaf leaf-7"></span>
    <span class="leaf leaf-8"></span>
    <span class="leaf leaf-9"></span>
    <span class="leaf leaf-10"></span>
  </div>

  <div class="pay-wrapper">
    <div class="pay-card">
      <h1>Chá com Maria</h1>
      <p class="pay-value" id="valorPagamento">R$ 63,00</p>

      <div class="pay-qrcode"><img src="images/pix.jpeg" alt="QR code Pix" /></div>

      <p class="pay-key-label">Pix Copia e Cola</p>
      <div class="pay-key">
        <input type="text" id="chavePix" value="00020126850014br.gov.bcb.pix01367e12eb01-be2d-4c73-924d-f5f1fab721bd0223Inscricao Cha com Maria520400005303986540563.005802BR5913MEIRI MIRANDA6009Sao Paulo62230519daqr55030327959557563045EDB" readonly />
        <button id="copiarChave">Copiar</button>
      </div>

      <p class="pay-hint">Após pagar, envie o comprovante pelo WhatsApp para confirmar sua inscrição.</p>

      <a id="linkWhatsapp" class="pay-whatsapp" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.4-1.5-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5C10 9 9.4 7.6 9.2 7c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3 4.8 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.3-.1-.2-.3-.3-.6-.4z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.4 5.2L2 22l4.9-1.3C8.4 21.6 10.1 22 12 22c5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3.5 1 1-3.4-.2-.3C3.5 14.5 3 13.3 3 12c0-4.9 4-9 9-9s9 4 9 9-4 9-9 9z"/></svg>
        Enviar comprovante no WhatsApp
      </a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const valor = parseFloat(params.get('valor')) || 63;
    document.getElementById('valorPagamento').textContent = valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    const valorFormatado = valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const mensagemWhatsapp = `Olá! Acabei de pagar a inscrição do Chá com Maria (${valorFormatado}). Segue o comprovante:`;
    document.getElementById('linkWhatsapp').href = `https://wa.me/5544999351008?text=${encodeURIComponent(mensagemWhatsapp)}`;

    document.getElementById('copiarChave').addEventListener('click', () => {
      const input = document.getElementById('chavePix');
      input.select();
      navigator.clipboard.writeText(input.value);
    });
  </script>

</body>
</html>
